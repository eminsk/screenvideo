name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Native FASM x64 Executable
        shell: cmd
        run: |
          cd asm
          FASM.EXE screenvideo.asm ScreenCapturePro.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: asm/ScreenCapturePro.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
