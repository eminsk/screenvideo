[project]
name = "screenvideo"
version = "1.0.0"
description = "ScreenCapture Pro - Professional zero-memory screen recorder with modern UI and hotkey controls"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "mss>=9.0.0",
    "keyboard>=0.13.5",
    "ttkbootstrap>=1.10.0",
    "pillow>=10.0.0",
    "nuitka>=2.0.0",
    "soundcard>=0.4.6",
    "soundfile>=0.14.0",
    "imageio-ffmpeg>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
