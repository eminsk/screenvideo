[project]
name = "screenvideo"
version = "0.1.0"
description = "Screen recorder with hotkey controls"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "mss>=9.0.0",
    "keyboard>=0.13.5",
    "ttkbootstrap>=1.10.0",
    "pillow>=12.0.0",
    "nuitka>=2.8.9",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
